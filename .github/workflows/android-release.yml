name: Build Android APK

# 双端仓库: 只构建 android/ 目录。
#   - 推 main 且改动落在 android/ 时构建(只看 android/, 改 ios/ 不会触发)
#   - 打 tag(vX.Y.Z)时构建并把 APK 附到同名 Release, 与 iOS 的 IPA 同一个 Release
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

env:
  VERSION_NAME: "1.2.9"
  VERSION_CODE: "23"
  # 统一发布证书的 SHA-256(公开指纹, 不是口令): 签名一旦漂移立刻失败
  CERT_SHA256: "13fbc983ce20b3dc7bfbbbc13327b39769209ebe84ad146d7c89fe582c00fbde"

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK 与 build-tools
        run: |
          set -euo pipefail
          # 用 runner 预装 SDK; android-actions/setup-android 会调用已下线的 "tools" 包而失败
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          test -x "$SDKMANAGER" || { echo "未找到 sdkmanager"; ls -R "$ANDROID_SDK_ROOT" | head -40; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          ls "$ANDROID_SDK_ROOT/build-tools"

      # 固定发布签名: 私钥只以 base64 存在 GitHub Secret 里, 仓库内不放明文
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: 还原统一发布 keystore
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"
          FPR=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | tr -d ':')
          # 不用 grep -q: pipefail 下 grep 提前退出会让上游吃 SIGPIPE, 把命中也判成失败
          if [[ "${FPR,,}" != *"$CERT_SHA256"* ]]; then
            echo "keystore 证书指纹不符"
            echo "$FPR" | tail -20
            exit 1
          fi
          echo "keystore 已还原, 证书指纹与发布指纹一致"

      - name: 校验版本号一致
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          s = open("app/build.gradle", encoding="utf-8").read()
          code = re.search(r'versionCode\s+(\d+)', s).group(1)
          name = re.search(r'versionName\s+"([^"]+)"', s).group(1)
          env_name, env_code = os.environ["VERSION_NAME"], os.environ["VERSION_CODE"]
          assert (name, code) == (env_name, env_code), (name, code, env_name, env_code)
          print("build.gradle / workflow 版本一致:", name, code)
          PY

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 构建 release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "没有生成 APK"; ls -R app/build/outputs | head -40; exit 1; }
          ls -lh "$APK"

      - name: 校验 APK 签名与版本
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | head -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt | head -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" | tr -d ':')
          echo "$CERTS"
          if [[ "${CERTS,,}" != *"$CERT_SHA256"* ]]; then
            echo "APK 签名证书与发布指纹不一致(是否误用了 debug 签名?)"
            exit 1
          fi
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | sed -n '1,3p'
          if [[ "$BADGING" != *"versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"* ]]; then
            echo "APK 版本号与 workflow 不一致"
            exit 1
          fi
          if [[ "$BADGING" != *"REQUEST_INSTALL_PACKAGES"* ]]; then
            echo "缺少 REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
          XMLTREE=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)
          if [[ "$XMLTREE" != *"com.sijia.go.apkfiles"* ]]; then
            echo "更新安装用的 ApkProvider 未注册"
            exit 1
          fi
          echo "APK 签名 / 版本 / 应用内更新配置校验通过"

      - name: 改名并上传
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/清弈-v${VERSION_NAME}.apk"
          ls -lh dist
          {
            echo "### 清弈 v${VERSION_NAME} (${VERSION_CODE})"
            echo ""
            echo "- 安装包: \`清弈-v${VERSION_NAME}.apk\`"
            echo "- 签名 SHA-256: \`$CERT_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: qingyi-android-apk
          path: android/dist/*.apk
          if-no-files-found: error

      # 打 tag 时把 APK 附到 Release; iOS 的 IPA 会附到同一个 tag 的 Release
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/*.apk
          name: 清弈 ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            清弈 ${{ github.ref_name }}（Android + iOS 双端）

            - Android：`清弈-v1.2.9.apk`，统一发布证书签名，可直接覆盖安装升级（versionCode 23）。
            - iOS：`QingYi-unsigned.ipa`，未签名，需自签（AltStore / Sideloadly / 开发者证书重签）后侧载安装。

            源码：安卓见 `android/`，iOS 见 `ios/`。
